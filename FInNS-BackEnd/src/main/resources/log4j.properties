# 콘솔 출력 - Docker/Tomcat 로그로 수집된다
log4j.rootLogger=INFO, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p %c{2} - %m%n

# 우리 코드: 서비스 로그 + MyBatis 매퍼(namespace = com.finns.*.mapper)가 실행한 SQL
log4j.logger.com.finns=DEBUG

# 로그가 많은 라이브러리는 경고 이상만
log4j.logger.com.zaxxer.hikari=WARN
log4j.logger.org.mybatis.spring=WARN
