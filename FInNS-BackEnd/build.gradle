plugins {
  id 'java'
  id 'war'
}

group 'com.finns'
version '1.0'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.9.2'
  springVersion = '5.3.37'
  lombokVersion = '1.18.30'
  springSecurityVersion='5.8.13'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  // 스프링
  implementation ("org.springframework:spring-context:${springVersion}")
          { exclude group: 'commons-logging', module: 'commons-logging' }
  implementation "org.springframework:spring-webmvc:${springVersion}"

  // 서블릿 API는 Tomcat이 제공
  compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

  // 로깅: SLF4J + reload4j(log4j 1.2 호환, 보안 패치 유지) - 설정은 log4j.xml
  implementation 'org.slf4j:slf4j-api:2.0.9'
  runtimeOnly 'org.slf4j:jcl-over-slf4j:2.0.9'
  runtimeOnly 'org.slf4j:slf4j-reload4j:2.0.9'

  // Lombok
  compileOnly "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

  // Jackson - Json 처리
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.4'

  // 데이터베이스
  implementation 'com.mysql:mysql-connector-j:8.1.0'
  implementation 'com.zaxxer:HikariCP:2.7.4'

  implementation "org.springframework:spring-tx:${springVersion}"
  implementation "org.springframework:spring-jdbc:${springVersion}"

  // MyBatis
  implementation 'org.mybatis:mybatis:3.4.6'
  implementation 'org.mybatis:mybatis-spring:1.3.2'

  // 보안
  implementation("org.springframework.security:spring-security-web:${springSecurityVersion}")
  implementation("org.springframework.security:spring-security-config:${springSecurityVersion}")
  implementation("org.springframework.security:spring-security-core:${springSecurityVersion}")

  // jjwt
  implementation("io.jsonwebtoken:jjwt-api:0.11.5")
  runtimeOnly("io.jsonwebtoken:jjwt-impl:0.11.5")
  implementation("io.jsonwebtoken:jjwt-jackson:0.11.5")

  // 테스트
  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

  // API 문서 (/swagger-ui.html)
  implementation 'io.springfox:springfox-swagger2:2.9.2'
  implementation 'io.springfox:springfox-swagger-ui:2.9.2'
}


test {
  useJUnitPlatform()
}

// 프론트 빌드 결과물(FInNS-FrontEnd/dist)을 WAR의 /resources 에 넣는다
// 화면 경로는 /resources/index.html, 정적 파일은 /assets/** → /resources/assets/ 로 서빙됨 (ServletConfig)
def frontendDist = file('../FInNS-FrontEnd/dist')
war {
  archiveFileName = 'finns.war'
  from(frontendDist) {
    into 'resources'
  }
  doFirst {
    if (!file("${frontendDist}/index.html").exists()) {
      throw new GradleException('프론트 빌드 결과물이 없습니다. FInNS-FrontEnd에서 npm run build 를 먼저 실행하세요.')
    }
  }
}

