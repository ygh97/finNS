# main에 푸시하면 배포 이미지를 빌드해 ghcr.io 에 올리고, (설정했다면) 서버가 새 이미지로 다시 실행한다.
# 서버 자동 반영은 저장소 설정(Settings → Secrets and variables → Actions)에 아래 값을 넣어야 동작한다.
#   Variables: DEPLOY_ENABLED = true
#   Secrets:   SSH_HOST(서버 IP), SSH_USER(ubuntu), SSH_KEY(개인키 내용)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/finns

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  server:
    needs: image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            cd ~/finNS
            git pull --ff-only
            docker compose pull
            docker compose up -d
            docker image prune -f
